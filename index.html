<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEURALSYS - Advanced Manager</title>
  <style>
    :root {
      --bg-void: #030508;
      --panel-bg: #0b111e;
      --border-glow: rgba(0, 243, 255, 0.2);
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff2a6d;
      --text-main: #d1d5db;
      --text-dim: #4b5563;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background-color: var(--bg-void); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--panel-bg); border-bottom: 1px solid var(--border-glow); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    h1 { color: var(--neon-cyan); font-size: 1.2rem; text-shadow: 0 0 10px rgba(0,243,255,0.4); }
    main { flex: 1; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; }
    aside { background: rgba(11, 17, 30, 0.5); border-right: 1px solid var(--border-glow); padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
    section { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .btn { background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; cursor: pointer; transition: 0.2s; border-radius: 4px; font-weight: bold; }
    .btn:hover { background: var(--neon-cyan); color: var(--bg-void); box-shadow: 0 0 10px var(--neon-cyan); }
    .btn-danger { border-color: var(--neon-pink); color: var(--neon-pink); }
    .btn-danger:hover { background: var(--neon-pink); color: var(--bg-void); box-shadow: 0 0 10px var(--neon-pink); }
    input, select, textarea { background: #050811; border: 1px solid var(--border-glow); color: var(--text-main); padding: 10px; border-radius: 4px; width: 100%; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--neon-cyan); box-shadow: 0 0 5px rgba(0,243,255,0.3); }
    .card { background: var(--panel-bg); border: 1px solid var(--border-glow); padding: 15px; border-radius: 6px; display: flex; flex-direction: column; gap: 10px; }
    .folder-item { padding: 10px; cursor: pointer; border: 1px solid transparent; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .folder-item:hover, .folder-item.active { background: rgba(0,243,255,0.05); border-color: var(--neon-cyan); }
    .task-item { background: #050811; border-left: 4px solid var(--neon-cyan); padding: 12px; border-radius: 4px; display: flex; flex-direction: column; gap: 8px; }
    .task-item.high { border-left-color: var(--neon-pink); }
    .task-item.medium { border-left-color: var(--neon-purple); }
    .row { display: flex; gap: 10px; align-items: center; }
  </style>
</head>
<body>

  <header>
    <h1>// NEURALSYS_OS v2.0</h1>
    <div id="status">Sistema Activo</div>
  </header>

  <main>
    <aside>
      <h3>PROYECTOS / CARPETAS</h3>
      <div class="row">
        <input type="text" id="newFolderName" placeholder="Nueva Carpeta...">
        <button class="btn" onclick="app.createFolder()">+</button>
      </div>
      <div id="folderList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </aside>

    <section id="contentArea">
      <div id="noFolderSelected" class="card">
        <h3>Selecciona o crea una carpeta/proyecto a la izquierda para empezar a gestionar tus tareas y registros.</h3>
      </div>

      <div id="activeFolderView" style="display:none; flex-direction:column; gap:20px;">
        <div class="row" style="justify-content: space-between;">
          <h2 id="currentFolderName" style="color:var(--neon-cyan)">Carpeta</h2>
          <button class="btn btn-danger" onclick="app.deleteCurrentFolder()">Eliminar Carpeta</button>
        </div>

        <!-- Panel de Creación de Tareas / Notas / Audios -->
        <div class="card">
          <h3>NUEVO REGISTRO EN ESTE PROYECTO</h3>
          <input type="text" id="taskTitle" placeholder="Título de la tarea o nota...">
          <textarea id="taskDesc" placeholder="Detalles de la tarea..." rows="2"></textarea>
          
          <div class="row">
            <select id="taskPriority">
              <option value="low">Prioridad Baja</option>
              <option value="medium">Prioridad Media</option>
              <option value="high">Prioridad Alta (Urgente)</option>
            </select>
            <button class="btn" onclick="app.saveTask()">Guardar Texto</button>
          </div>

          <!-- Grabadora de Audio Funcional -->
          <div style="border-top:1px dashed var(--border-glow); padding-top:10px; margin-top:5px;">
            <p style="font-size: 0.9rem; margin-bottom: 5px;">Grabadora de Audio Integrada:</p>
            <div class="row">
              <button class="btn" id="recBtn" onclick="app.toggleRecording()">🎙️ Grabar Audio</button>
              <span id="recStatus" style="font-size:0.8rem; color:var(--neon-pink);">Listo para grabar</span>
            </div>
            <audio id="audioPreview" controls style="width:100%; margin-top:10px; display:none;"></audio>
          </div>
        </div>

        <!-- Listado de Elementos del Proyecto -->
        <h3>REGISTROS DEL PROYECTO</h3>
        <div id="taskList" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    </section>
  </main>

  <script>
    class NeuralDB {
      constructor() {
        this.dbName = 'NeuralDB_V2';
        this.db = null;
      }
      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, 1);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => { this.db = request.result; resolve(this.db); };
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id', autoIncrement: true });
            if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id', autoIncrement: true });
          };
        });
      }
      async getAll(store) {
        return new Promise((resolve) => {
          const tx = this.db.transaction(store, 'readonly');
          const req = tx.objectStore(store).getAll();
          req.onsuccess = () => resolve(req.result);
        });
      }
      async add(store, data) {
        return new Promise((resolve) => {
          const tx = this.db.transaction(store, 'readwrite');
          const req = tx.objectStore(store).add(data);
          req.onsuccess = () => resolve(req.result);
        });
      }
      async delete(store, id) {
        return new Promise((resolve) => {
          const tx = this.db.transaction(store, 'readwrite');
          const req = tx.objectStore(store).delete(Number(id));
          req.onsuccess = () => resolve();
        });
      }
    }

    class NeuralApp {
      constructor() {
        this.db = new NeuralDB();
        this.currentFolderId = null;
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.audioBlob = null;
        this.isRecording = false;
      }

      async init() {
        await this.db.init();
        await this.loadFolders();
      }

      async loadFolders() {
        const folders = await this.db.getAll('folders');
        const list = document.getElementById('folderList');
        list.innerHTML = '';
        folders.forEach(f => {
          const div = document.createElement('div');
          div.className = `folder-item ${this.currentFolderId === f.id ? 'active' : ''}`;
          div.innerHTML = `<span>📁 ${f.name}</span>`;
          div.onclick = () => this.selectFolder(f.id, f.name);
          list.appendChild(div);
        });
      }

      async createFolder() {
        const input = document.getElementById('newFolderName');
        const name = input.value.trim();
        if (!name) return;
        await this.db.add('folders', { name });
        input.value = '';
        this.loadFolders();
      }

      async selectFolder(id, name) {
        this.currentFolderId = id;
        document.getElementById('noFolderSelected').style.display = 'none';
        document.getElementById('activeFolderView').style.display = 'flex';
        document.getElementById('currentFolderNameinnerText') || (document.getElementById('currentFolderName').innerText = `Proyecto: ${name}`);
        this.loadFolders();
        this.loadItems();
      }

      async deleteCurrentFolder() {
        if (!this.currentFolderId) return;
        if (!confirm('¿Borrar esta carpeta y todos sus registros?')) return;
        const items = await this.db.getAll('items');
        for (let item of items) {
          if (item.folderId === this.currentFolderId) await this.db.delete('items', item.id);
        }
        await this.db.delete('folders', this.currentFolderId);
        this.currentFolderId = null;
        document.getElementById('noFolderSelected').style.display = 'flex';
        document.getElementById('activeFolderView').style.display = 'none';
        this.loadFolders();
      }

      async toggleRecording() {
        const recBtn = document.getElementById('recBtn');
        const recStatus = document.getElementById('recStatus');
        const audioPreview = document.getElementById('audioPreview');

        if (!this.isRecording) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.mediaRecorder = new MediaRecorder(stream);
            this.audioChunks = [];
            this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
            this.mediaRecorder.onstop = () => {
              this.audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
              const audioUrl = URL.createObjectURL(this.audioBlob);
              audioPreview.src = audioUrl;
              audioPreview.style.display = 'block';
            };
            this.mediaRecorder.start();
            this.isRecording = true;
            recBtn.innerText = '⏹️ Detener Grabación';
            recStatus.innerText = 'Grabando audio...';
          } catch (err) {
            alert('No se pudo acceder al micrófono. Revisa los permisos.');
          }
        } else {
          this.mediaRecorder.stop();
          this.isRecording = false;
          recBtn.innerText = '🎙️ Grabar Audio';
          recStatus.innerText = 'Audio listo para guardar';
        }
      }

      async saveTask() {
        if (!this.currentFolderId) return alert('Selecciona una carpeta primero');
        const title = document.getElementById('taskTitle').value.trim();
        const desc = document.getElementById('taskDesc').value.trim();
        const priority = document.getElementById('taskPriority').value;

        if (!title && !this.audioBlob) return alert('Escribe un título o graba un audio');

        let audioBase64 = null;
        if (this.audioBlob) {
          audioBase64 = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(this.audioBlob);
          });
        }

        await this.db.add('items', {
          folderId: this.currentFolderId,
          title: title || 'Nota de Voz',
          desc,
          priority,
          audio: audioBase64,
          date: new Date().toLocaleString()
        });

        // Limpiar campos
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDesc').value = '';
        document.getElementById('audioPreview').style.display = 'none';
        this.audioBlob = null;
        document.getElementById('recStatus').innerText = 'Listo para grabar';
        this.loadItems();
      }

      async loadItems() {
        const items = await this.db.getAll('items');
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';
        
        const filtered = items.filter(i => i.folderId === this.currentFolderId);
        if (filtered.length === 0) {
          taskList.innerHTML = '<p style="color:var(--text-dim)">No hay registros en este proyecto aún.</p>';
          return;
        }

        filtered.reverse().forEach(item => {
          const div = document.createElement('div');
          div.className = `task-item ${item.priority}`;
          div.innerHTML = `
            <div class="row" style="justify-content:space-between">
              <strong>${item.title}</strong>
              <span style="font-size:0.75rem; color:var(--text-dim)">${item.date}</span>
            </div>
            ${item.desc ? `<p style="font-size:0.9rem">${item.desc}</p>` : ''}
            ${item.audio ? `<audio controls src="${item.audio}" style="width:100%; margin-top:5px;"></audio>` : ''}
            <button class="btn btn-danger" style="align-self:flex-end; padding:2px 8px; font-size:0.7rem;" onclick="app.deleteItem(${item.id})">Borrar</button>
          `;
          taskList.appendChild(div);
        });
      }

      async deleteItem(id) {
        await this.db.delete('items', id);
        this.loadItems();
      }
    }

    const app = new NeuralApp();
    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
