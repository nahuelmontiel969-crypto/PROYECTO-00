<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEURALSYS - Mobile Manager</title>
  <style>
    :root {
      --bg-void: #030508;
      --panel-bg: #0b111e;
      --border-glow: rgba(0, 243, 255, 0.2);
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff2a6d;
      --text-main: #d1d5db;
      --text-dim: #4b5563;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background-color: var(--bg-void); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 30px; }
    header { background: var(--panel-bg); border-bottom: 1px solid var(--border-glow); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
    h1 { color: var(--neon-cyan); font-size: 1rem; text-shadow: 0 0 10px rgba(0,243,255,0.4); }
    main { padding: 12px; display: flex; flex-direction: column; gap: 15px; }
    .btn { background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 10px 15px; cursor: pointer; transition: 0.2s; border-radius: 4px; font-weight: bold; font-size: 0.9rem; text-align: center; }
    .btn:active { background: var(--neon-cyan); color: var(--bg-void); }
    .btn-danger { border-color: var(--neon-pink); color: var(--neon-pink); }
    input, select, textarea { background: #050811; border: 1px solid var(--border-glow); color: var(--text-main); padding: 12px; border-radius: 4px; width: 100%; outline: none; font-size: 0.95rem; }
    .card { background: var(--panel-bg); border: 1px solid var(--border-glow); padding: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 10px; }
    .folder-item { padding: 12px; cursor: pointer; border: 1px solid var(--border-glow); border-radius: 4px; display: flex; justify-content: space-between; align-items: center; background: #050811; margin-bottom: 6px; }
    .folder-item.active { border-color: var(--neon-cyan); background: rgba(0,243,255,0.05); }
    .task-item { background: #050811; border-left: 4px solid var(--neon-cyan); padding: 12px; border-radius: 4px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .task-item.high { border-left-color: var(--neon-pink); }
    .task-item.medium { border-left-color: var(--neon-purple); }
    .row { display: flex; gap: 8px; align-items: center; width: 100%; }
    .section-title { color: var(--neon-cyan); font-size: 0.95rem; margin-bottom: 5px; border-bottom: 1px solid var(--border-glow); padding-bottom: 4px; }
  </style>
</head>
<body>

  <header>
    <h1>// NEURALSYS_MOBILE</h1>
    <span id="status" style="font-size: 0.8rem; color: var(--neon-cyan);">Activo</span>
  </header>

  <main>
    <!-- SECCIÓN DE CARPETAS -->
    <div class="card">
      <div class="section-title">📁 MIS PROYECTOS Y CARPETAS</div>
      <div class="row">
        <input type="text" id="newFolderName" placeholder="Nueva carpeta...">
        <button class="btn" onclick="app.createFolder()" style="white-space: nowrap;">Crear</button>
      </div>
      <div id="folderList" style="max-height: 150px; overflow-y: auto;"></div>
    </div>

    <!-- CONTENIDO DE LA CARPETA ACTIVA -->
    <div id="noFolderSelected" class="card" style="text-align: center; padding: 20px;">
      <p style="color: var(--text-dim); font-size: 0.9rem;">Selecciona o crea una carpeta arriba para ver y añadir tus registros.</p>
    </div>

    <div id="activeFolderView" class="card" style="display:none; border-color: var(--neon-cyan);">
      <div class="row" style="justify-content: space-between;">
        <h2 id="currentFolderName" style="color:var(--neon-cyan); font-size: 1.1rem;">Carpeta</h2>
        <button class="btn btn-danger" onclick="app.deleteCurrentFolder()" style="padding: 6px 10px; font-size: 0.8rem;">Borrar Carpeta</button>
      </div>

      <div class="section-title" style="margin-top: 10px;">NUEVO REGISTRO</div>
      <input type="text" id="taskTitle" placeholder="Título de la tarea o nota...">
      <textarea id="taskDesc" placeholder="Escribe detalles aquí..." rows="2"></textarea>
      
      <select id="taskPriority">
        <option value="low">Prioridad Baja</option>
        <option value="medium">Prioridad Media</option>
        <option value="high">Prioridad Alta (Urgente)</option>
      </select>

      <button class="btn" onclick="app.saveTask()">Guardar Texto</button>

      <!-- Grabadora de Audio -->
      <div style="border-top:1px dashed var(--border-glow); padding-top:10px; margin-top:5px;">
        <div class="row" style="justify-content: space-between;">
          <button class="btn" id="recBtn" onclick="app.toggleRecording()" style="flex:1;">🎙️ Grabar Audio</button>
        </div>
        <p id="recStatus" style="font-size:0.75rem; color:var(--neon-pink); margin-top: 5px; text-align: center;">Listo para grabar</p>
        <audio id="audioPreview" controls style="width:100%; margin-top:8px; display:none;"></audio>
      </div>

      <div class="section-title" style="margin-top: 15px;">REGISTROS GUARDADOS</div>
      <div id="taskList"></div>
    </div>
  </main>

  <script>
    class NeuralDB {
      constructor() {
        this.dbName = 'NeuralDB_MobileV1';
        this.db = null;
      }
      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, 1);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => { this.db = request.result; resolve(this.db); };
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id', autoIncrement: true });
            if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id', autoIncrement: true });
          };
        });
      }
      async getAll(store) {
        return new Promise((resolve) => {
          const tx = this.db.transaction(store, 'readonly');
          const req = tx.objectStore(store).getAll();
          req.onsuccess = () => resolve(req.result);
        });
      }
      async add(store, data) {
        return new Promise((resolve) => {
          const tx = this.db.transaction(store, 'readwrite');
          const req = tx.objectStore(store).add(data);
          req.onsuccess = () => resolve(req.result);
        });
      }
      async delete(store, id) {
        return new Promise((resolve) => {
          const tx = this.db.transaction(store, 'readwrite');
          const req = tx.objectStore(store).delete(Number(id));
          req.onsuccess = () => resolve();
        });
      }
    }

    class NeuralApp {
      constructor() {
        this.db = new NeuralDB();
        this.currentFolderId = null;
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.audioBlob = null;
        this.isRecording = false;
      }

      async init() {
        await this.db.init();
        await this.loadFolders();
      }

      async loadFolders() {
        const folders = await this.db.getAll('folders');
        const list = document.getElementById('folderList');
        list.innerHTML = '';
        if(folders.length === 0) {
          list.innerHTML = '<p style="color:var(--text-dim); font-size:0.85rem; padding: 5px;">No hay carpetas creadas.</p>';
          return;
        }
        folders.forEach(f => {
          const div = document.createElement('div');
          div.className = `folder-item ${this.currentFolderId === f.id ? 'active' : ''}`;
          div.innerHTML = `<span>📁 ${f.name}</span> <span style="font-size:0.8rem; color:var(--neon-cyan)">Abrir ▶</span>`;
          div.onclick = () => this.selectFolder(f.id, f.name);
          list.appendChild(div);
        });
      }

      async createFolder() {
        const input = document.getElementById('newFolderName');
        const name = input.value.trim();
        if (!name) return;
        await this.db.add('folders', { name });
        input.value = '';
        this.loadFolders();
      }

      async selectFolder(id, name) {
        this.currentFolderId = id;
        document.getElementById('noFolderSelected').style.display = 'none';
        document.getElementById('activeFolderView').style.display = 'flex';
        document.getElementById('currentFolderName').innerText = name;
        this.loadFolders();
        this.loadItems();
      }

      async deleteCurrentFolder() {
        if (!this.currentFolderId) return;
        if (!confirm('¿Eliminar esta carpeta y todos sus registros?')) return;
        const items = await this.db.getAll('items');
        for (let item of items) {
          if (item.folderId === this.currentFolderId) await this.db.delete('items', item.id);
        }
        await this.db.delete('folders', this.currentFolderId);
        this.currentFolderId = null;
        document.getElementById('noFolderSelected').style.display = 'flex';
        document.getElementById('activeFolderView').style.display = 'none';
        this.loadFolders();
      }

      async toggleRecording() {
        const recBtn = document.getElementById('recBtn');
        const recStatus = document.getElementById('recStatus');
        const audioPreview = document.getElementById('audioPreview');

        if (!this.isRecording) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.mediaRecorder = new MediaRecorder(stream);
            this.audioChunks = [];
            this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
            this.mediaRecorder.onstop = () => {
              this.audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
              audioPreview.src = URL.createObjectURL(this.audioBlob);
              audioPreview.style.display = 'block';
            };
            this.mediaRecorder.start();
            this.isRecording = true;
            recBtn.innerText = '⏹️ Detener Grabación';
            recStatus.innerText = '🔴 Grabando...';
          } catch (err) {
            alert('Permiso de micrófono denegado o no disponible.');
          }
        } else {
          this.mediaRecorder.stop();
          this.isRecording = false;
          recBtn.innerText = '🎙️ Grabar Audio';
          recStatus.innerText = '✔️ Audio listo para guardar';
        }
      }

      async saveTask() {
        if (!this.currentFolderId) return alert('Selecciona una carpeta');
        const title = document.getElementById('taskTitle').value.trim();
        const desc = document.getElementById('taskDesc').value.trim();
        const priority = document.getElementById('taskPriority').value;

        if (!title && !this.audioBlob) return alert('Escribe un título o graba audio');

        let audioBase64 = null;
        if (this.audioBlob) {
          audioBase64 = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(this.audioBlob);
          });
        }

        await this.db.add('items', {
          folderId: this.currentFolderId,
          title: title || 'Nota de Voz',
          desc,
          priority,
          audio: audioBase64,
          date: new Date().toLocaleDateString()
        });

        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDesc').value = '';
        document.getElementById('audioPreview').style.display = 'none';
        this.audioBlob = null;
        document.getElementById('recStatus').innerText = 'Listo para grabar';
        this.loadItems();
      }

      async loadItems() {
        const items = await this.db.getAll('items');
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';
        
        const filtered = items.filter(i => i.folderId === this.currentFolderId);
        if (filtered.length === 0) {
          taskList.innerHTML = '<p style="color:var(--text-dim); font-size:0.85rem;">No hay registros aquí.</p>';
          return;
        }

        filtered.reverse().forEach(item => {
          const div = document.createElement('div');
          div.className = `task-item ${item.priority}`;
          div.innerHTML = `
            <div class="row" style="justify-content:space-between">
              <strong style="font-size:0.9rem">${item.title}</strong>
              <span style="font-size:0.7rem; color:var(--text-dim)">${item.date}</span>
            </div>
            ${item.desc ? `<p style="font-size:0.85rem">${item.desc}</p>` : ''}
            ${item.audio ? `<audio controls src="${item.audio}" style="width:100%; margin-top:5px;"></audio>` : ''}
            <button class="btn btn-danger" style="align-self:flex-end; padding:2px 8px; font-size:0.7rem;" onclick="app.deleteItem(${item.id})">Eliminar</button>
          `;
          taskList.appendChild(div);
        });
      }

      async deleteItem(id) {
        await this.db.delete('items', id);
        this.loadItems();
      }
    }

    const app = new NeuralApp();
    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
